<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TXG Owner/Admin</title>
<style>:root{--b:#07101f;--c:#0e1a2d;--l:#21314a;--t:#eef5ff;--m:#91a0b8;--a:#1677ff}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font-family:Inter,system-ui,Arial}.wrap{max-width:1200px;margin:auto;padding:20px}.card{background:var(--c);border:1px solid var(--l);border-radius:15px;padding:17px;margin-bottom:15px}.auth{max-width:450px;margin:8vh auto}input,textarea,select{width:100%;padding:11px;margin:5px 0 10px;background:#091527;border:1px solid var(--l);border-radius:9px;color:#fff}button{border:0;border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer;background:#15243a;color:#fff}.primary{background:var(--a)}.good{background:#155a43}.danger{background:#7d2430}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}.tabs .on{background:var(--a)}.section{display:none}.section.on{display:block}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{font-size:25px;font-weight:800}.muted{color:var(--m)}.scroll{overflow:auto;max-height:500px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:9px;border-bottom:1px solid var(--l);text-align:left}.notice{padding:10px;background:#14253c;border-radius:9px;margin:8px 0}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}</style></head><body>
<div id="login" class="wrap card auth"><h2>TXG Admin / Owner Login</h2><input id="id" placeholder="Username / email / mobile"><input id="pw" type="password" placeholder="Password"><button class="primary" onclick="login()">Continue → Telegram OTP</button><div id="lm"></div></div>
<div id="otp" class="wrap card auth" style="display:none"><h2>Telegram OTP</h2><p class="muted">Check the linked Telegram account.</p><input id="code" maxlength="6" inputmode="numeric" placeholder="6-digit OTP"><button class="primary" onclick="verify()">Verify</button><div id="om"></div></div>
<div id="panel" class="wrap" style="display:none"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><h2>👑 TXG Admin Panel</h2><div><span id="who" class="muted"></span> <button onclick="location.href='/'">User Site</button><button class="danger" onclick="logout()">Logout</button></div></div>
<div class="tabs"><button class="on" onclick="tab('dash',this)">Dashboard</button><button onclick="tab('dep',this)">Deposits</button><button onclick="tab('wd',this)">Withdrawals</button><button onclick="tab('users',this)">Users</button><button onclick="tab('tx',this)">Transactions</button><button onclick="tab('audit',this)">Audit</button><button id="settab" onclick="tab('settings',this)">Settings</button><button id="ownerTab" style="display:none" onclick="tab('owner',this)">Owner</button></div>
<div id="dash" class="section on"><div class="grid"><div class="card">Users<div id="su" class="stat">0</div></div><div class="card">Pending deposits<div id="sd" class="stat">0</div></div><div class="card">Pending withdrawals<div id="sw" class="stat">0</div></div><div class="card">Volume<div id="sv" class="stat">₹0</div></div></div></div>
<div id="dep" class="section card"><h3>Deposits</h3><div id="deps" class="scroll"></div></div>
<div id="wd" class="section card"><h3>Withdrawals</h3><div id="wds" class="scroll"></div></div>
<div id="users" class="section card"><h3>Users</h3><div id="us" class="scroll"></div></div>
<div id="tx" class="section card"><h3>Transactions</h3><div id="ts" class="scroll"></div></div>
<div id="audit" class="section card"><h3>Audit logs</h3><div id="au" class="scroll"></div></div>
<div id="settings" class="section card"><h3>Settings</h3><label>UPI</label><input id="upi"><label>QR image URL</label><input id="qr"><label>Ads</label><textarea id="ads"></textarea><label>Channel URL</label><input id="ch"><label>Deposit mode</label><select id="dm"><option>manual</option><option>provider</option></select><div class="grid"><div><label>Min withdraw</label><input id="wmin"></div><div><label>Max withdraw</label><input id="wmax"></div><div><label>Alert enabled</label><select id="ae"><option>true</option><option>false</option></select></div><div><label>Alert chat ID</label><input id="ac"></div></div><button class="primary" onclick="saveSettings()">Save</button><div id="sm"></div></div>
<div id="owner" class="section"><div class="card"><h3>Create normal admin</h3><input id="au1" placeholder="Username"><input id="ae1" placeholder="Email"><input id="ap1" placeholder="Mobile +919..."><input id="aw1" type="password" placeholder="Password (10+)"><button class="primary" onclick="createAdmin()">Create</button><div id="cm"></div></div><div class="card"><h3>Admins</h3><div id="admins"></div></div></div></div>
<script>
let token=localStorage.getItem("txg_token"),challenge="",me=null;$=x=>document.getElementById(x);const money=x=>"₹"+Number(x||0).toFixed(2);
async function api(u,o={}){o.headers={...(o.headers||{}),...(token?{Authorization:"Bearer "+token}:{})};if(o.body){o.headers["Content-Type"]="application/json";o.body=JSON.stringify(o.body)}let r=await fetch(u,o),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Request failed");return d}
async function login(){try{let d=await api("/api/auth/login",{method:"POST",body:{username:$("id").value,password:$("pw").value}});challenge=d.challenge;$("login").style.display="none";$("otp").style.display="block"}catch(e){$("lm").innerHTML="<div class='notice'>"+e.message+"</div>"}}
async function verify(){try{let d=await api("/api/auth/verify-login",{method:"POST",body:{challenge,otp:$("code").value}});token=d.token;localStorage.setItem("txg_token",token);$("otp").style.display="none";$("panel").style.display="block";init()}catch(e){$("om").innerHTML="<div class='notice'>"+e.message+"</div>"}}
function tab(id,b){document.querySelectorAll(".section").forEach(x=>x.classList.remove("on"));$(id).classList.add("on");document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));b.classList.add("on");({dash:stats,dep:deps,wd:wds,users:users,tx:tx,audit:audit,settings:settings,owner:admins}[id]||(()=>{}))()}
async function init(){try{let x=await api("/api/me");me=x.user;$("who").textContent="@"+me.username+" ("+me.role+")";if(me.role==="owner")$("ownerTab").style.display="inline-block";stats()}catch{logout()}}
async function stats(){let x=await api("/api/admin/stats");$("su").textContent=x.users;$("sd").textContent=x.depositsPending;$("sw").textContent=x.withdrawalsPending;$("sv").textContent=money(x.volume)}
async function deps(){let x=await api("/api/admin/deposits");$("deps").innerHTML="<table><tr><th>ID</th><th>User</th><th>Amount</th><th>Ref</th><th>Status</th><th></th></tr>"+x.deposits.map(a=>`<tr><td>${a.id}</td><td>${a.public_id}</td><td>${money(a.amount)}</td><td>${a.reference||""}</td><td>${a.status}</td><td>${a.status==="pending"?`<button class="good" onclick="review('deposits',${a.id},'approve')">Approve</button> <button class="danger" onclick="review('deposits',${a.id},'reject')">Reject</button>`:"—"}</td></tr>`).join("")+"</table>"}
async function wds(){let x=await api("/api/admin/withdrawals");$("wds").innerHTML="<table><tr><th>ID</th><th>User</th><th>Amount</th><th>UPI</th><th>Status</th><th></th></tr>"+x.withdrawals.map(a=>`<tr><td>${a.id}</td><td>${a.public_id}</td><td>${money(a.amount)}</td><td>${a.upi_id}</td><td>${a.status}</td><td>${a.status==="pending"?`<button class="good" onclick="review('withdrawals',${a.id},'approve')">Approve</button> <button class="danger" onclick="review('withdrawals',${a.id},'reject')">Reject</button>`:"—"}</td></tr>`).join("")+"</table>"}
async function review(type,id,action){let note=prompt("Note")||"";try{await api("/api/admin/"+type+"/"+id+"/review",{method:"POST",body:{action,note}});type==="deposits"?deps():wds();stats()}catch(e){alert(e.message)}}
async function users(){let x=await api("/api/admin/users");$("us").innerHTML="<table><tr><th>ID</th><th>User</th><th>Mobile</th><th>TG</th><th>Balance</th><th>Status</th><th></th></tr>"+x.users.map(a=>`<tr><td>${a.public_id}</td><td>@${a.username}</td><td>${a.phone_e164}</td><td>${a.telegram_verified?"✓":"—"}</td><td>${money(a.balance)}</td><td>${a.status}</td><td>${me.role==="owner"&&a.role==="user"?`<button onclick="adj(${a.id})">Add/Cut</button>`:""}</td></tr>`).join("")+"</table>"}
async function adj(id){let amount=prompt("Positive = add, negative = cut");let reason=prompt("Reason");if(!reason)return;try{await api("/api/admin/users/"+id+"/balance",{method:"POST",body:{amount,reason}});users()}catch(e){alert(e.message)}}
async function tx(){let x=await api("/api/admin/transactions");$("ts").innerHTML="<table><tr><th>ID</th><th>User</th><th>Kind</th><th>Amount</th><th>Status</th><th>Ref</th></tr>"+x.transactions.map(a=>`<tr><td>${a.id}</td><td>${a.username}</td><td>${a.kind}</td><td>${money(a.amount)}</td><td>${a.status}</td><td>${a.reference}</td></tr>`).join("")+"</table>"}
async function audit(){let x=await api("/api/admin/audit");$("au").innerHTML="<table><tr><th>Time</th><th>Actor</th><th>Action</th><th>Target</th><th>IP</th></tr>"+x.logs.map(a=>`<tr><td>${a.created_at}</td><td>${a.username||"system"}</td><td>${a.action}</td><td>${a.target_type||""} ${a.target_id||""}</td><td>${a.ip||""}</td></tr>`).join("")+"</table>"}
async function settings(){if(me.role!=="owner")return;let x=await api("/api/admin/settings");$("upi").value=x.upi_id;$("qr").value=x.qr_image_url;$("ads").value=x.ads_text;$("ch").value=x.channel_url;$("dm").value=x.deposit_mode;$("wmin").value=x.withdraw_min;$("wmax").value=x.withdraw_max;$("ae").value=x.alert_bot_enabled;$("ac").value=x.alert_chat_id}
async function saveSettings(){try{await api("/api/admin/settings",{method:"POST",body:{upi_id:$("upi").value,qr_image_url:$("qr").value,ads_text:$("ads").value,channel_url:$("ch").value,deposit_mode:$("dm").value,withdraw_min:$("wmin").value,withdraw_max:$("wmax").value,alert_bot_enabled:$("ae").value,alert_chat_id:$("ac").value}});$("sm").innerHTML="<div class='notice'>Saved.</div>"}catch(e){$("sm").innerHTML="<div class='notice'>"+e.message+"</div>"}}
async function createAdmin(){try{await api("/api/owner/admins",{method:"POST",body:{username:$("au1").value,email:$("ae1").value,phone_e164:$("ap1").value,password:$("aw1").value}});$("cm").innerHTML="<div class='notice'>Created.</div>";admins()}catch(e){$("cm").innerHTML="<div class='notice'>"+e.message+"</div>"}}
async function admins(){if(me.role!=="owner")return;let x=await api("/api/owner/admins");$("admins").innerHTML="<table><tr><th>User</th><th>Mobile</th><th>Status</th><th></th></tr>"+x.admins.map(a=>`<tr><td>@${a.username}</td><td>${a.phone_e164}</td><td>${a.status}</td><td><button class="${a.status==='active'?'danger':'good'}" onclick="ast(${a.id},'${a.status==='active'?'suspended':'active'}')">${a.status==='active'?'Suspend':'Activate'}</button></td></tr>`).join("")+"</table>"}
async function ast(id,status){await api("/api/owner/admins/"+id+"/status",{method:"POST",body:{status}});admins()}
async function logout(){try{await api("/api/auth/logout",{method:"POST"})}catch{}localStorage.removeItem("txg_token");location.reload()}
if(token){$("login").style.display="none";$("panel").style.display="block";init()}
</script></body></html>
